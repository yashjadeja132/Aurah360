name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend:
    name: Backend test & smoke prep
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports: ['27017:27017']
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Env validation (syntax)
        run: |
          cat > .env <<'EOF'
          NODE_ENV=test
          MONGODB_URI=mongodb://127.0.0.1:27017/aurah360_test
          JWT_ACCESS_SECRET=ci-access-secret-min-32-characters!!
          JWT_REFRESH_SECRET=ci-refresh-secret-min-32-characters!
          CORS_ORIGINS=http://localhost:5173
          EOF
      - name: Import app module
        run: node -e "import('./src/config/env.js').then(() => console.log('env ok'))"
      - name: Unit + integration tests (Vitest)
        run: npm test
      # NOTE: intentionally non-blocking (continue-on-error) for now — there may be
      # pre-existing findings that shouldn't suddenly break every PR. Tighten this
      # (remove continue-on-error) once the dependency baseline is clean.
      - name: npm audit (backend)
        continue-on-error: true
        run: npm audit --audit-level=high

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_BASE_URL: /api/v1
      # NOTE: intentionally non-blocking (continue-on-error) for now — there may be
      # pre-existing findings that shouldn't suddenly break every PR. Tighten this
      # (remove continue-on-error) once the dependency baseline is clean.
      - name: npm audit (frontend)
        continue-on-error: true
        run: npm audit --audit-level=high

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f docker/Dockerfile.api -t aurah360-api:ci .
      - name: Build Web image
        run: docker build -f docker/Dockerfile.web -t aurah360-web:ci .

  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks-action free/OSS mode: no license key required for a basic scan.
      # If your org later adopts the paid Gitleaks license, add a GITLEAKS_LICENSE
      # secret and reference it here (env: GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}).
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-placeholder:
    name: Deployment placeholder
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Placeholder
        run: |
          echo "Deploy step placeholder — wire to your host/K8s/registry."
          echo "Suggested: push images, migrate, rolling restart PM2/compose."
